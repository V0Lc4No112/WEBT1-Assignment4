<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/task1.css">
</head>
<body>
  <main class="container-xxl py-3 py-md-5">
    <div class="booking">
      <div class="booking-header px-4 px-md-5 py-4">
        <h1 class="fs-2 fw-bold mb-0">Book a train ticket</h1>
      </div>

      <form class="p-4 p-md-5">
        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>
          <div class="btn-group trip d-flex d-md-inline-flex">
            <input type="radio" class="btn-check" name="trip" id="one-way" value="one-way" checked>
            <label class="btn btn-lg px-4" for="one-way">One way</label>
            <input type="radio" class="btn-check" name="trip" id="round-trip" value="round-trip">
            <label class="btn btn-lg px-4" for="round-trip">Round trip</label>
          </div>
        </fieldset>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="from" name="from" placeholder="From" required>
              <label for="from">From</label>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="to" name="to" placeholder="To" required>
              <label for="to">To</label>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-4">
            <label for="departure" class="form-label">Departure</label>
            <input type="date" class="form-control" id="departure" name="departure" required>
          </div>
          <div class="col-12 col-md-4">
            <label for="return" class="form-label">Return</label>
            <input type="date" class="form-control" id="return" name="return">
          </div>
          <div class="col-12 col-md-4">
            <label for="passengers" class="form-label">Passengers</label>
            <select class="form-select" id="passengers" name="passengers">
              <option value="1">1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <fieldset class="mb-4">
          <legend class="form-label fs-6">Carriage class</legend>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
            <label class="form-check-label" for="seat">Seat</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe">
            <label class="form-check-label" for="coupe">Coupé</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
            <label class="form-check-label" for="sleeper">Sleeper</label>
          </div>
        </fieldset>

        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" autocomplete="tel" required>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
          <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rules" name="rules" required>
          <label class="form-check-label" for="rules">I agree with the carriage rules</label>
        </div>

        <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
          <button type="reset" class="btn btn-lg btn-clear rounded-pill px-5">Clear</button>
          <button type="submit" class="btn btn-lg btn-find rounded-pill px-5">Find trains</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
